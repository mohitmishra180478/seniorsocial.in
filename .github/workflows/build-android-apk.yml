name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Create Android project files
        working-directory: mobile_app
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Copy Android Firebase config
        run: cp mobile_app/firebase/android/google-services.json mobile_app/android/app/google-services.json

      - name: Build debug APK
        working-directory: mobile_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: senior-social-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
