name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name senior_social .

      - name: Set Android package name, app label and min SDK
        working-directory: mobile_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'com.example.senior_social': 'in.seniorsocial.app',
              'android:label="senior_social"': 'android:label="Senior Social"',
          }

          targets = []
          targets.extend(Path('android/app').glob('build.gradle*'))
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              targets.append(manifest)

          for path in targets:
              text = path.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)

              text = text.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 23')
              text = text.replace('minSdkVersion 21', 'minSdkVersion 23')
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              text = text.replace('minSdk = 21', 'minSdk = 23')
              text = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', text)
              text = re.sub(r'minSdkVersion\s+21', 'minSdkVersion 23', text)
              text = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 23', text)
              text = re.sub(r'minSdk\s*=\s*21', 'minSdk = 23', text)

              path.write_text(text)

          print('--- Android Gradle files after update ---')
          for path in Path('android/app').glob('build.gradle*'):
              print(f'FILE: {path}')
              print(path.read_text())
          PY

      - name: Remove generated Flutter test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart

      - name: Verify Android Firebase config
        run: test -f mobile_app/android/app/google-services.json

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build debug APK
        working-directory: mobile_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: senior-social-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
