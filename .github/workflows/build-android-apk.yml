name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: mobile_app
        run: flutter create --platforms=android --project-name senior_social .

      - name: Set Android package name and app label
        working-directory: mobile_app
        run: |
          if [ -f android/app/build.gradle ]; then
            sed -i "s/applicationId \"com.example.senior_social\"/applicationId \"in.seniorsocial.app\"/g" android/app/build.gradle
            sed -i "s/namespace \"com.example.senior_social\"/namespace \"in.seniorsocial.app\"/g" android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.example.senior_social"/applicationId = "in.seniorsocial.app"/g' android/app/build.gradle.kts
            sed -i 's/namespace = "com.example.senior_social"/namespace = "in.seniorsocial.app"/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="senior_social"/android:label="Senior Social"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Remove generated Flutter test
        working-directory: mobile_app
        run: rm -f test/widget_test.dart

      - name: Verify Android Firebase config
        run: test -f mobile_app/android/app/google-services.json

      - name: Install dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: mobile_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build debug APK
        working-directory: mobile_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: senior-social-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
