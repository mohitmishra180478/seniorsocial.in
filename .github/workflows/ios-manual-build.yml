name: Build iOS Manual

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ios-manual-build.yml'
      - 'mobile_app/**'

jobs:
  build-ios-manual:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Prepare iOS Flutter project
        working-directory: mobile_app
        run: |
          flutter create . --platforms=ios --org in.seniorsocial --project-name senior_social
          test -f ios/Runner/GoogleService-Info.plist
          rm -f test/widget_test.dart
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Senior Social" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Senior Social" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier in.seniorsocial.app" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 13.0" ios/Runner/Info.plist || true

      - name: Install Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Create iOS Podfile with iOS 13 target
        working-directory: mobile_app
        run: |
          cat > ios/Podfile <<'EOF'
platform :ios, '13.0'
ENV['COCOAPODS_DISABLE_STATS'] = 'true'

project 'Runner', {
  'Debug' => :debug,
  'Profile' => :release,
  'Release' => :release,
}

def flutter_root
  generated_xcode_build_settings_path = File.expand_path(File.join('..', 'Flutter', 'Generated.xcconfig'), __FILE__)
  unless File.exist?(generated_xcode_build_settings_path)
    raise "Generated.xcconfig must exist. Run flutter pub get first."
  end

  File.foreach(generated_xcode_build_settings_path) do |line|
    matches = line.match(/FLUTTER_ROOT\=(.*)/)
    return matches[1].strip if matches
  end
  raise "FLUTTER_ROOT not found in Generated.xcconfig."
end

require File.expand_path(File.join('packages', 'flutter_tools', 'bin', 'podhelper'), flutter_root)

flutter_ios_podfile_setup

target 'Runner' do
  use_frameworks!
  use_modular_headers!
  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))
end

post_install do |installer|
  installer.pods_project.targets.each do |target|
    flutter_additional_ios_build_settings(target)
    target.build_configurations.each do |config|
      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'
    end
  end
end
EOF

      - name: Install iOS pods
        working-directory: mobile_app/ios
        run: pod install --repo-update

      - name: Analyze Flutter app
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos

      - name: Build iOS without code signing
        working-directory: mobile_app
        run: flutter build ios --debug --no-codesign

      - name: Upload unsigned iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: senior-social-ios-unsigned-build
          path: mobile_app/build/ios/iphoneos/Runner.app
          if-no-files-found: warn
